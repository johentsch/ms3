[build-system]
# Keep the build independent of Git tags, including in pre-commit checkouts.
# A future PyScaffold update may restore setuptools-scm; review that diff.
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ms3"
version = "2.7.0"
dynamic = [
    "authors",
    "classifiers",
    "dependencies",
    "description",
    "entry-points",
    "gui-scripts",
    "license",
    "optional-dependencies",
    "readme",
    "requires-python",
    "scripts",
    "urls"
]
